name: Device not found or not supported
description: A Lian Li screen, fan or controller that LumaLi doesn't see or drive yet
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        LumaLi supports the Universal Screen 8.8", its light strip, TL Wireless LCD fans and SL/TL wireless fan controllers.
        Flex LCD fans (TL Flex LCD, SL Infinity Flex LCD) and wired TL LCD fans are **experimental**: reports from owners are what make them work.
        The device report lists every Lian Li USB device Windows knows, with its vendor and product IDs, which is what's needed to add one.
  - type: input
    id: product
    attributes:
      label: Product
      description: The exact product name, e.g. "SL Infinity Flex LCD 120".
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Device report
      description: Settings → Devices → Copy device report, then paste here.
      render: text
    validations:
      required: true
  - type: textarea
    id: seen
    attributes:
      label: What you see
      description: Does it show on the Fan screens page? Does the screen light up, stay black, or show L-Connect's picture?
  - type: dropdown
    id: lconnect
    attributes:
      label: Does it work in L-Connect?
      options:
        - "Yes"
        - "No"
        - Haven't tried
