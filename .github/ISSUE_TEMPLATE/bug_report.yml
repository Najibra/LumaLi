name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The device report is the most useful part: in LumaLi open **Settings → Devices → Copy device report** and paste it below.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Device report
      description: Settings → Devices → Copy device report, then paste here.
      render: text
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Running as administrator?
      description: CPU temperature and the game frame rate need it.
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: dropdown
    id: lconnect
    attributes:
      label: Is L-Connect also installed or running?
      options:
        - Closed while using LumaLi
        - Running at the same time
        - Not installed
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Settings → About → Open log. Paste the last lines around the problem.
      render: text
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or a short video (optional)
